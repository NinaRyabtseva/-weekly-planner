<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5fb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Моя неделя</title>
<style>
:root{--bg:#f7f5fb;--card:#fff;--text:#222127;--muted:#77727f;--a:#8b6fd8;--soft:#eee8ff;--line:#eeeaf3;--danger:#b64e5f}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(247,245,251,.94);backdrop-filter:blur(18px);padding:12px 0}
.top,.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:29px;margin:0}.round{border:0;background:var(--a);color:#fff;width:42px;height:42px;border-radius:50%;font-size:25px}
.weeknav{margin-top:12px}.navbtn{border:0;background:var(--soft);color:var(--a);padding:10px 14px;border-radius:14px;font-weight:700}.today{display:block;margin:7px auto 0;border:0;background:none;color:var(--a);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 8px 28px rgba(40,30,70,.07)}.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.day{font-size:20px;font-weight:800}.date,.meta,.empty{font-size:13px;color:var(--muted)}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.check{width:24px;height:24px;border:2px solid var(--a);border-radius:50%;background:#fff;flex:none}.check.done{background:var(--a);color:#fff}.main{flex:1;min-width:0}.title{font-weight:700}.doneText{text-decoration:line-through;color:var(--muted)}.meta{margin-top:4px}.icon{border:0;background:none;font-size:17px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);display:flex;justify-content:center;border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:250px;border:0;background:none;color:var(--muted);font-size:12px;padding:5px}.tab b{display:block;font-size:21px;margin-bottom:2px}.tab.active{color:var(--a)}
dialog{border:0;border-radius:24px;width:min(92vw,520px);padding:0;box-shadow:0 24px 70px #0003}dialog::backdrop{background:#0004}form{padding:20px}.ft{font-size:23px;font-weight:800}label{display:block;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #ddd5eb;border-radius:14px;padding:12px;background:#fff;font-size:16px}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.ghost,.primary,.danger{border:0;border-radius:14px;padding:11px 14px}.primary{background:var(--a);color:#fff;font-weight:800}.ghost{background:#eeeaf4}.danger{background:#ffe8ec;color:var(--danger)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow{text-align:center;font-size:11px;color:var(--muted);font-weight:700}.cell{border:0;background:#fff;border-radius:12px;min-height:48px;padding:6px 3px;font-size:14px}.cell.todayCell{outline:2px solid var(--a)}.cell.selected{background:var(--soft)}.dot{width:5px;height:5px;background:var(--a);border-radius:50%;margin:4px auto 0}.sectiontitle{font-size:19px;font-weight:800;margin:20px 2px 8px}.event{background:#fff;border-radius:17px;padding:13px;margin:9px 0}.eventTop{display:flex;justify-content:space-between;gap:8px}.pill{display:inline-block;background:var(--soft);color:var(--a);font-size:12px;font-weight:700;border-radius:99px;padding:4px 8px;margin-top:7px}.notes textarea{min-height:120px}.note{background:#fff;border-radius:18px;padding:14px;margin:10px 0}.note h3{margin:0 0 7px}.note p{white-space:pre-wrap;margin:0;color:#4d4952}.small{font-size:12px;color:var(--muted);margin-top:7px}
</style>
</head><body><div class="app"><header><div class="top"><h1 id="pageTitle">Моя неделя</h1><button class="round" id="plus">+</button></div><div id="subhead"></div></header><main id="content"></main></div>
<nav class="tabs"><button class="tab active" data-tab="week"><b>✓</b>Неделя</button><button class="tab" data-tab="calendar"><b>▣</b>Календарь</button><button class="tab" data-tab="notes"><b>✎</b>Заметки</button></nav>

<dialog id="dlg"><form method="dialog" id="form"><div class="ft" id="formTitle"></div><div id="fields"></div><div class="actions"><button type="button" class="ghost" id="cancel">Отмена</button><button class="primary" value="default">Сохранить</button></div></form></dialog>

<script>
const $=s=>document.querySelector(s), KEY="moyaNedelya.final.v1";
const defaults=[
[1,"Уборка 2-го этажа","Дом"],[1,"Стирка постельного","Дом"],[1,"Полить цветы","Дом"],[1,"Маска для волос","Личное"],[1,"Обкатка себе и детям","Личное"],[1,"Разрыв связей","Личное"],[1,"Фитнес","Личное"],[1,"Масло Кеша / рр. масло","Личное"],[1,"Детям ванна с солью","Дети"],[1,"Math Beast (30 мин)","Учёба"],[1,"Прописи англ.","Учёба"],
[2,"Уборка санузлов","Дом"],[2,"Мыть полы","Дом"],[2,"Черн. св.","Личное"],[2,"Растяжка","Личное"],[2,"Альгинатная маска","Личное"],[2,"Англ. чтение","Учёба"],[2,"Написание англ. слов","Учёба"],
[3,"Уборка кухни","Дом"],[3,"Тканевая маска","Личное"],[3,"Фитнес, силовая","Личное"],[3,"Хаушка масло","Личное"],[3,"Math Beast","Учёба"],[3,"Написание слов","Учёба"],
[4,"Уборка гостиной, игровой","Дом"],[4,"Обкатка себе и детям","Личное"],[4,"Отдых (чтение книги, встреча)","Личное"],[4,"Растяжка","Личное"],[4,"Math Beast","Учёба"],[4,"Прописи русские","Учёба"],[4,"Зубы с содой","Личное"],
[5,"[Уточнить запись с фото]","Личное"],[5,"Сбор коробок, гараж","Дом"],[5,"Отдых","Личное"],[5,"Фитнес, силовая","Личное"],[5,"Обтирка солью","Личное"],[5,"Англ. чтение","Учёба"],[5,"Написание слов","Учёба"],
[6,"Бассейн с детьми","Дети"],[6,"Семейный просмотр видео","Дети"],[6,"Покормить животных","Дом"],[6,"Свечка роду","Личное"],[6,"У Алины отдых","Дети"],[6,"YouTube: рисование карандашами","Дети"],
[0,"Math Singapore","Учёба"],[0,"Чтение по-русски","Учёба"],[0,"Мыть голову детям","Дети"],[0,"Настольные игры","Дети"],[0,"Готовка","Дом"]
].map((x,i)=>({id:"r"+i,weekday:x[0],title:x[1],category:x[2]}));
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{recurring:defaults,done:{},events:[],notes:[]};
let tab="week",weekOffset=0,monthOffset=0,selectedDate=iso(new Date()),mode="",editId=null;
const emoji={"Дом":"🏠","Личное":"💜","Дети":"👧","Учёба":"📚","Работа":"💼"};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function iso(d){return new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function sow(d){let x=new Date(d),q=x.getDay()||7;x.setHours(0,0,0,0);x.setDate(x.getDate()-q+1);return x}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(d,o){return new Intl.DateTimeFormat("ru-RU",o).format(d)}
function openDlg(title,fields,newMode,id=null){mode=newMode;editId=id;$("#formTitle").textContent=title;$("#fields").innerHTML=fields;$("#dlg").showModal()}
function render(){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));$("#subhead").innerHTML=""; if(tab==="week")week();else if(tab==="calendar")calendar();else notes()}
function week(){
 $("#pageTitle").textContent="Моя неделя";let base=add(sow(new Date()),weekOffset*7),end=add(base,6);
 $("#subhead").innerHTML=`<div class="weeknav"><button class="navbtn" id="pw">‹</button><b>${fmt(base,{day:"numeric",month:"short"})} – ${fmt(end,{day:"numeric",month:"short"})}</b><button class="navbtn" id="nw">›</button></div><button class="today" id="tw">Эта неделя</button>`;
 $("#pw").onclick=()=>{weekOffset--;render()};$("#nw").onclick=()=>{weekOffset++;render()};$("#tw").onclick=()=>{weekOffset=0;render()};
 let h="";for(let i=0;i<7;i++){let d=add(base,i),key=iso(d),wd=d.getDay();h+=`<section class="card"><div class="head"><div class="day">${fmt(d,{weekday:"long"}).replace(/^./,m=>m.toUpperCase())}</div><div class="date">${fmt(d,{day:"numeric",month:"long"})}</div></div>`;
 state.recurring.filter(x=>x.weekday===wd).forEach(t=>{let k=key+"|"+t.id,done=!!state.done[k];h+=`<div class="item"><button class="check ${done?"done":""}" data-done="${esc(k)}">${done?"✓":""}</button><div class="main"><div class="title ${done?"doneText":""}">${esc(t.title)}</div><div class="meta">${emoji[t.category]||""} ${esc(t.category)} · ↻ каждую неделю</div></div><button class="icon editR" data-id="${t.id}">✎</button></div>`});h+="</section>"}
 $("#content").innerHTML=h;document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{state.done[b.dataset.done]=!state.done[b.dataset.done];save();render()});
 document.querySelectorAll(".editR").forEach(b=>b.onclick=()=>{let t=state.recurring.find(x=>x.id===b.dataset.id);openDlg("Изменить дело",taskFields(t.title,t.category,t.weekday),"recurring",t.id)})
}
function taskFields(title="",cat="Личное",wd=1){return `<label>Дело</label><input id="fTitle" value="${esc(title)}" required><label>День недели</label><select id="fWeekday">${["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"].map((n,i)=>`<option value="${i}" ${i==wd?"selected":""}>${n}</option>`).join("")}</select><label>Категория</label><select id="fCat">${["Личное","Дом","Дети","Учёба","Работа"].map(x=>`<option ${x===cat?"selected":""}>${x}</option>`).join("")}</select>`}
function calendar(){
 $("#pageTitle").textContent="Календарь";let now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+monthOffset,1),y=m.getFullYear(),mo=m.getMonth();
 $("#subhead").innerHTML=`<div class="weeknav"><button class="navbtn" id="pm">‹</button><b>${fmt(m,{month:"long",year:"numeric"})}</b><button class="navbtn" id="nm">›</button></div>`;
 $("#pm").onclick=()=>{monthOffset--;render()};$("#nm").onclick=()=>{monthOffset++;render()};
 let first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),g=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<first;i++)g+=`<div></div>`;for(let n=1;n<=days;n++){let d=new Date(y,mo,n),k=iso(d),has=state.events.some(e=>e.date===k);g+=`<button class="cell ${k===iso(now)?"todayCell":""} ${k===selectedDate?"selected":""}" data-date="${k}">${n}${has?'<div class="dot"></div>':""}</button>`}
 let ev=state.events.filter(e=>e.date===selectedDate).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
 $("#content").innerHTML=`<div class="card"><div class="calgrid">${g}</div></div><div class="sectiontitle">${fmt(new Date(selectedDate+"T12:00"),{day:"numeric",month:"long"})}</div>${ev.length?ev.map(e=>eventHTML(e)).join(""):'<div class="empty">На этот день событий нет.</div>'}`;
 document.querySelectorAll(".cell[data-date]").forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});document.querySelectorAll(".delE").forEach(b=>b.onclick=()=>{state.events=state.events.filter(e=>e.id!==b.dataset.id);save();render()})
}
function eventHTML(e){return `<div class="event"><div class="eventTop"><div><b>${esc(e.title)}</b><div class="meta">${e.time?esc(e.time)+" · ":""}${esc(e.place||"")}</div></div><button class="icon delE" data-id="${e.id}">🗑️</button></div>${e.note?`<div class="small">${esc(e.note)}</div>`:""}<span class="pill">🔔 ${esc(e.reminder||"без напоминания")}</span></div>`}
function eventFields(){return `<label>Событие / appointment / дело</label><input id="eTitle" required><div class="row"><div><label>Дата</label><input id="eDate" type="date" value="${selectedDate}" required></div><div><label>Время</label><input id="eTime" type="time"></div></div><label>Место</label><input id="ePlace" placeholder="Адрес или место"><label>Напоминание</label><select id="eReminder"><option>за 1 час</option><option>за 1 день</option><option>за 30 минут</option><option>за 10 минут</option><option>без напоминания</option></select><label>Заметка</label><textarea id="eNote"></textarea><div class="small">Напоминание внутри этой веб-версии не является гарантированным системным push-уведомлением iPhone.</div>`}
function notes(){
 $("#pageTitle").textContent="Заметки";
 $("#content").innerHTML=state.notes.length?state.notes.map(n=>`<div class="note">
   <div class="eventTop">
     <h3>${esc(n.title)}</h3>
     <div>
       <button class="icon editN" data-id="${n.id}" title="Редактировать">✎</button>
       <button class="icon delN" data-id="${n.id}" title="Удалить">🗑️</button>
     </div>
   </div>
   <p>${esc(n.text)}</p>
   <div class="small">${esc(n.updated||n.created)}</div>
 </div>`).join(""):'<div class="card empty">Заметок пока нет. Нажми +, чтобы создать.</div>';

 document.querySelectorAll(".editN").forEach(b=>b.onclick=()=>{
   const n=state.notes.find(x=>x.id===b.dataset.id);
   if(!n)return;
   openDlg("Редактировать заметку",
     `<label>Название</label><input id="nTitle" value="${esc(n.title)}" required>
      <label>Текст</label><textarea id="nText" required>${esc(n.text)}</textarea>`,
     "noteEdit",n.id);
 });

 document.querySelectorAll(".delN").forEach(b=>b.onclick=()=>{
   state.notes=state.notes.filter(n=>n.id!==b.dataset.id);save();render()
 })
}
$("#plus").onclick=()=>{if(tab==="week")openDlg("Новое повторяющееся дело",taskFields(),"recurring");else if(tab==="calendar")openDlg("Новое событие",eventFields(),"event");else openDlg("Новая заметка",`<label>Название</label><input id="nTitle" required><label>Текст</label><textarea id="nText" required></textarea>`,"note")};
$("#cancel").onclick=()=>$("#dlg").close();
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$("#form").addEventListener("submit",()=>{
 if(mode==="recurring"){let obj={id:editId||("r"+Date.now()),title:$("#fTitle").value.trim(),weekday:+$("#fWeekday").value,category:$("#fCat").value};if(editId){let i=state.recurring.findIndex(x=>x.id===editId);state.recurring[i]=obj}else state.recurring.push(obj)}
 if(mode==="event"){state.events.push({id:"e"+Date.now(),title:$("#eTitle").value.trim(),date:$("#eDate").value,time:$("#eTime").value,place:$("#ePlace").value.trim(),reminder:$("#eReminder").value,note:$("#eNote").value.trim()});selectedDate=$("#eDate").value}
 if(mode==="note"){
   state.notes.unshift({
     id:"n"+Date.now(),
     title:$("#nTitle").value.trim(),
     text:$("#nText").value.trim(),
     created:fmt(new Date(),{day:"numeric",month:"long",year:"numeric"})
   })
 }
 if(mode==="noteEdit"){
   const n=state.notes.find(x=>x.id===editId);
   if(n){
     n.title=$("#nTitle").value.trim();
     n.text=$("#nText").value.trim();
     n.updated="Изменено: "+fmt(new Date(),{day:"numeric",month:"long",year:"numeric"})
   }
 }
 save();setTimeout(render,0)
});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script></body></html>
