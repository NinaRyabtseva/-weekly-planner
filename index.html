<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Моя неделя</title>
  <style>
    :root{
      --bg:#f7f5fb; --card:#ffffff; --text:#1f1f24; --muted:#77727f;
      --accent:#8b6fd8; --accent2:#eee8ff; --danger:#b64e5f;
      --shadow:0 8px 28px rgba(40,30,70,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}
    header{position:sticky;top:0;z-index:5;background:rgba(247,245,251,.9);backdrop-filter:blur(18px);padding:12px 0 10px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:30px;margin:0}
    button{font:inherit}
    .round{border:0;background:var(--accent);color:#fff;width:42px;height:42px;border-radius:50%;font-size:25px;box-shadow:var(--shadow)}
    .weeknav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
    .navbtn{border:0;background:var(--accent2);color:var(--accent);padding:10px 14px;border-radius:14px;font-weight:700}
    #weekLabel{font-weight:700}
    .day{background:var(--card);border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
    .dayhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
    .dayname{font-size:20px;font-weight:800}.date{color:var(--muted);font-size:14px}
    .empty{color:var(--muted);padding:8px 2px}
    .task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid #eeeaf3}
    .task:first-of-type{border-top:0}
    .check{margin-top:1px;width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);background:white}
    .check.done{background:var(--accent);position:relative}.check.done:after{content:"✓";color:#fff;position:absolute;left:4px;top:-2px;font-weight:800}
    .taskmain{flex:1}.title{font-weight:700}.title.done{text-decoration:line-through;color:var(--muted)}
    .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
    .trash{border:0;background:transparent;color:var(--danger);font-size:18px}
    .cal{border:0;background:transparent;color:var(--accent);font-size:18px}
    dialog{border:0;border-radius:24px;width:min(92vw,520px);padding:0;box-shadow:0 24px 70px rgba(0,0,0,.2)}
    dialog::backdrop{background:rgba(0,0,0,.25);backdrop-filter:blur(3px)}
    form{padding:20px}.formtitle{font-size:24px;font-weight:800;margin-bottom:14px}
    label{display:block;font-weight:700;margin:14px 0 6px}
    input,select{width:100%;border:1px solid #ddd5eb;border-radius:14px;padding:13px;background:#fff;font-size:16px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    .ghost{border:0;background:#eeeaf4;padding:11px 15px;border-radius:14px}
    .primary{border:0;background:var(--accent);color:#fff;padding:11px 15px;border-radius:14px;font-weight:800}
    .banner{background:#fff4ce;border-radius:16px;padding:12px 14px;font-size:14px;margin-top:12px;display:none}
    .todaybtn{display:block;margin:8px auto 0;border:0;background:transparent;color:var(--accent);font-weight:700}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div><h1>Моя неделя</h1></div>
      <button class="round" id="addBtn" aria-label="Добавить">+</button>
    </div>
    <div class="weeknav">
      <button class="navbtn" id="prev">‹</button>
      <span id="weekLabel"></span>
      <button class="navbtn" id="next">›</button>
    </div>
    <button class="todaybtn" id="todayBtn">Эта неделя</button>
    <div class="banner" id="banner"></div>
  </header>
  <main id="days"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="taskForm">
    <div class="formtitle">Новое дело</div>
    <label>Что нужно сделать</label>
    <input id="title" required placeholder="Например: позвонить врачу">
    <div class="row">
      <div><label>Дата</label><input id="date" type="date" required></div>
      <div><label>Время</label><input id="time" type="time" required></div>
    </div>
    <label>Категория</label>
    <select id="category">
      <option>Личное</option><option>Дом</option><option>Работа</option><option>Дети</option>
    </select>
    <label><input id="reminder" type="checkbox" checked style="width:auto"> Напомнить, пока приложение открыто</label>
    <div class="actions">
      <button type="button" class="ghost" id="cancel">Отмена</button>
      <button class="primary" value="default">Добавить</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const storeKey = "weeklyPlannerWeb.tasks.v1";
let tasks = JSON.parse(localStorage.getItem(storeKey) || "[]");
let weekOffset = 0;
let lastAlerted = new Set(JSON.parse(localStorage.getItem("weeklyPlannerWeb.alerted") || "[]"));

const emojis = {"Личное":"💜","Дом":"🏠","Работа":"💼","Дети":"👧"};

function save(){ localStorage.setItem(storeKey, JSON.stringify(tasks)); }
function startOfWeek(d){
  const x = new Date(d); const day = x.getDay() || 7;
  x.setHours(0,0,0,0); x.setDate(x.getDate()-day+1); return x;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isoDate(d){ return new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit"}).format(d); }
function fmtDay(d){ return new Intl.DateTimeFormat("ru-RU",{weekday:"long"}).format(d).replace(/^./,m=>m.toUpperCase()); }
function fmtDate(d){ return new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long"}).format(d); }
function weekBase(){ return addDays(startOfWeek(new Date()), weekOffset*7); }

function render(){
  const base = weekBase();
  const end = addDays(base,6);
  $("#weekLabel").textContent = `${new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"short"}).format(base)} – ${new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"short"}).format(end)}`;
  const host=$("#days"); host.innerHTML="";
  for(let i=0;i<7;i++){
    const d=addDays(base,i), key=isoDate(d);
    const dayTasks = tasks.filter(t=>t.date===key).sort((a,b)=>a.time.localeCompare(b.time));
    const sec=document.createElement("section"); sec.className="day";
    sec.innerHTML=`<div class="dayhead"><div class="dayname">${fmtDay(d)}</div><div class="date">${fmtDate(d)}</div></div>`;
    if(!dayTasks.length){
      const e=document.createElement("div"); e.className="empty"; e.textContent="Нет дел"; sec.appendChild(e);
    }
    for(const t of dayTasks){
      const row=document.createElement("div"); row.className="task";
      row.innerHTML=`
        <button class="check ${t.done?'done':''}" aria-label="Выполнено"></button>
        <div class="taskmain">
          <div class="title ${t.done?'done':''}">${escapeHtml(t.title)}</div>
          <div class="meta"><span>${t.time}</span><span>${emojis[t.category]||''} ${t.category}</span>${t.reminder?'<span>🔔</span>':''}</div>
        </div>
        <button class="cal" title="Добавить в календарь">📅</button>
        <button class="trash" title="Удалить">🗑️</button>`;
      row.querySelector(".check").onclick=()=>{t.done=!t.done; save(); render();};
      row.querySelector(".trash").onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id); save(); render();};
      row.querySelector(".cal").onclick=()=>downloadICS(t);
      sec.appendChild(row);
    }
    host.appendChild(sec);
  }
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

$("#addBtn").onclick=()=>{
  const now=new Date(); $("#title").value=""; $("#date").value=isoDate(now);
  $("#time").value=new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false}).format(now);
  $("#dlg").showModal(); setTimeout(()=>$("#title").focus(),100);
};
$("#cancel").onclick=()=>$("#dlg").close();
$("#prev").onclick=()=>{weekOffset--;render();};
$("#next").onclick=()=>{weekOffset++;render();};
$("#todayBtn").onclick=()=>{weekOffset=0;render();};

$("#taskForm").addEventListener("submit", e=>{
  const title=$("#title").value.trim(); if(!title) return;
  tasks.push({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    title, date:$("#date").value, time:$("#time").value,
    category:$("#category").value, reminder:$("#reminder").checked, done:false
  });
  save(); setTimeout(render,0);
});

function checkReminders(){
  const now=new Date();
  for(const t of tasks){
    if(!t.reminder || t.done || lastAlerted.has(t.id)) continue;
    const due=new Date(`${t.date}T${t.time}:00`);
    const diff=now-due;
    if(diff>=0 && diff<60000){
      alert(`Напоминание: ${t.title}`);
      lastAlerted.add(t.id);
      localStorage.setItem("weeklyPlannerWeb.alerted", JSON.stringify([...lastAlerted]));
    }
  }
}
setInterval(checkReminders,15000);

function downloadICS(t){
  const start = new Date(`${t.date}T${t.time}:00`);
  const end = new Date(start.getTime()+30*60000);
  const f=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const ics=`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//WeeklyPlanner//RU
BEGIN:VEVENT
UID:${t.id}@weeklyplanner
DTSTAMP:${f(new Date())}
DTSTART:${f(start)}
DTEND:${f(end)}
SUMMARY:${t.title.replace(/\n/g," ")}
END:VEVENT
END:VCALENDAR`;
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="event.ics"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
render();

const banner=$("#banner");
if(/iPhone|iPad/.test(navigator.userAgent) && !window.matchMedia("(display-mode: standalone)").matches){
  banner.style.display="block";
  banner.textContent="Чтобы установить как приложение: нажми «Поделиться» в Safari → «На экран Домой».";
}
</script>
</body>
</html>
